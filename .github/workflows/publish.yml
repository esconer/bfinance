name: Publish to PyPI and GitHub Releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.12

      - name: Install Dependencies
        run: uv sync --extra dev

      - name: Run Pytest
        run: uv run pytest

  publish:
    name: Build & Publish to PyPI
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"

      - name: Set up Python
        run: uv python install 3.12

      - name: Extract Clean Version
        id: get_version
        run: |
          RAW_VER=$(grep -m1 '^version =' pyproject.toml | sed -E 's/version = "(.*)"/\1/')
          echo "tag=v$RAW_VER" >> $GITHUB_OUTPUT
          echo "Extracted tag: v$RAW_VER"

      - name: Ensure Git Tag Exists (for manual workflow runs)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${{ steps.get_version.outputs.tag }}"
          git push origin "${{ steps.get_version.outputs.tag }}" --force

      - name: Build Distribution Packages (.whl and .tar.gz)
        run: |
          rm -rf dist/
          uv build

      - name: Publish to PyPI
        run: uv publish --token "${{ secrets.PYPI_API_TOKEN }}" || echo "Version already exists on PyPI. Continuing to GitHub Release."

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.get_version.outputs.tag }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || steps.get_version.outputs.tag }}
          files: dist/*
          generate_release_notes: true
